<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070f3" />
      <stop offset="50%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: url(#titleGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 11px;
        fill: #64748b;
      }
      .metric-value {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #38bdf8;
      }

      /* Animated Elements */
      @keyframes pulsePulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanBeam {
        0% { transform: translateX(0); opacity: 0.1; }
        50% { opacity: 0.6; }
        100% { transform: translateX(1100px); opacity: 0.1; }
      }

      .pulse-circle {
        animation: pulsePulse 6s ease-in-out infinite;
        transform-origin: center;
      }
      .float-card-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatSlow 6.5s ease-in-out infinite 1s;
      }
      .float-card-3 {
        animation: floatSlow 5.8s ease-in-out infinite 0.5s;
      }
      .animated-wire {
        stroke-dasharray: 6 6;
        animation: flowDash 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Glowing Blobs -->
  <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1020" cy="260" r="160" fill="#2563eb" opacity="0.20" filter="url(#glow)" class="pulse-circle" />
  <circle cx="750" cy="90" r="90" fill="#0d9488" opacity="0.15" filter="url(#glow)" class="pulse-circle" />

  <!-- Dynamic Connecting Network Wires in background -->
  <g fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.45">
    <path d="M 150 280 C 350 240, 500 320, 720 270" class="animated-wire" />
    <path d="M 720 270 C 850 240, 950 300, 1080 260" class="animated-wire" />
    <path d="M 520 80 C 650 140, 800 60, 950 110" class="animated-wire" />
  </g>

  <!-- Top Category Chip -->
  <g transform="translate(60, 48)">
    <rect width="280" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="20" class="badge-text">ENTERPRISE S2P &amp; ERP EXTENSIONS</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <!-- Note: Placed clearly in foreground with strong high-contrast typography -->
  <text x="60" y="125" class="title-text">Awesome Procurement Suite Extensions</text>
  <text x="60" y="162" class="title-text" fill="#38bdf8" style="font-size: 32px; fill: #38bdf8;">SAP Ariba Ecosystem &amp; Open Source Solutions</text>
  <text x="60" y="202" class="subtitle-text">Curated SaaS SolEx platforms, BTP CAP extensions, e-invoicing protocols &amp; contract intelligence</text>

  <!-- Bottom Dynamic Visual Feature Cards -->
  <!-- Feature Card 1: SAP Ariba Core & SolEx -->
  <g transform="translate(60, 235)" class="float-card-1">
    <rect width="240" height="78" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 23 28 L 27 32 L 34 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="32" class="node-text">SAP Ariba + SolEx</text>
    <text x="20" y="58" class="metric-label">Integration Standard</text>
    <text x="20" y="71" class="metric-value">BTP CAP &amp; APIs</text>
  </g>

  <!-- Feature Card 2: Source-to-Pay & CLM -->
  <g transform="translate(325, 235)" class="float-card-2">
    <rect width="240" height="78" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="12" fill="#0d9488" fill-opacity="0.2" stroke="#2dd4bf" stroke-width="1.5" />
    <path d="M 24 24 L 32 24 M 24 28 L 32 28 M 24 32 L 29 32" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
    <text x="48" y="32" class="node-text">CLM &amp; S2P Engines</text>
    <text x="20" y="58" class="metric-label">Autonomous &amp; MCP</text>
    <text x="20" y="71" class="metric-value" fill="#2dd4bf">AI Agentic Ready</text>
  </g>

  <!-- Feature Card 3: Open Source & Peppol -->
  <g transform="translate(590, 235)" class="float-card-3">
    <rect width="240" height="78" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="12" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="28" cy="28" r="5" fill="none" stroke="#818cf8" stroke-width="2" />
    <text x="48" y="32" class="node-text">Open Standards</text>
    <text x="20" y="58" class="metric-label">Global Compliance</text>
    <text x="20" y="71" class="metric-value" fill="#818cf8">OpenPeppol / AS4</text>
  </g>

  <!-- Feature Card 4: Market Scale -->
  <g transform="translate(855, 235)" class="float-card-1">
    <rect width="285" height="78" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="12" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M 23 32 L 27 26 L 31 29 L 35 23" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="32" class="node-text">Market Opportunity</text>
    <text x="20" y="58" class="metric-label">Global Procurement TAM (2026)</text>
    <text x="20" y="71" class="metric-value" fill="#fbbf24">$10.1B – $11.4B (10.2% CAGR)</text>
  </g>

  <!-- Border Frame Accent -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
</svg>